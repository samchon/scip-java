name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
jobs:
  format:
    runs-on: ubuntu-latest
    name: Formatting
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.4.1

      - run: gradle spotlessCheck --no-daemon

  kotlin_plugin:
    runs-on: ubuntu-latest
    name: scip-kotlinc
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.4.1

      - name: scip-kotlinc tests
        run: gradle :scip-kotlinc:test --no-daemon

  java_graph:
    name: Java graph (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.4.1

      - name: Compiler graph semantics and identity
        run: >-
          gradle :scip-javac:test
          --tests org.scip_code.scip_java.javac.JavaGraphShardTest
          --no-daemon --no-configuration-cache

      - name: Gradle graph store validity
        run: >-
          gradle :scip-gradle-plugin:test
          --tests org.scip_code.scip_java.gradle.GraphGenerationStoreTest
          --no-daemon --no-configuration-cache

      - name: Gradle and Maven graph lifecycles
        run: >-
          gradle :scip-java:test
          --tests tests.GradleGraphLifecycleTest
          --tests tests.MavenGraphLifecycleTest
          --tests tests.MavenGraphPluginTest
          --tests tests.GraphAggregateRunnerTest
          --tests tests.GradleBuildToolTest
          --no-daemon --no-configuration-cache --info
          "-Pkotlin.compiler.execution.strategy=in-process"
          "-Pkotlin.incremental=false"

  docker_test:
    runs-on: ubuntu-latest
    name: Docker CLI tests
    steps:
      - uses: actions/checkout@v7

      - name: Build Dockerised CLI
        run: docker build -t ghcr.io/scip-code/scip-java:latest .

      - name: Test repos
        shell: bash
        run: |
          set -eu
          check_repo() {
            REPO=$1
            mkdir -p ".repos/$REPO"
            git clone "https://github.com/$REPO.git" ".repos/$REPO" && cd ".repos/$REPO" && git submodule update --init

            docker run -v "$PWD/.repos/$REPO:/sources" -w /sources ghcr.io/scip-code/scip-java:latest scip-java index
            file ".repos/$REPO/index.scip" || (echo "$REPO SCIP index doesn't exist!"; exit 1)
          }

          sudo apt install parallel
          export -f check_repo

          parallel -j4 check_repo ::: circe/circe indeedeng/iwf-java-sdk

  ci-pass:
    if: always()
    needs: [format, kotlin_plugin, java_graph, docker_test]
    runs-on: ubuntu-latest
    name: CI pass
    steps:
      - if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
