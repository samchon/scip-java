plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.20'
    id 'org.jetbrains.kotlin.plugin.allopen' version '2.3.20'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
}

allOpen {
    annotation('example.OpenForGraph')
}

def generatedKotlin = layout.buildDirectory.dir('generated/sources/kotlin/main')
kotlin.sourceSets.main.kotlin.srcDir(generatedKotlin)

tasks.register('generateKotlinGraphFixture') {
    def output = generatedKotlin.map { it.file('example/Generated.kt') }
    outputs.file(output)
    doLast {
        def file = output.get().asFile
        file.parentFile.mkdirs()
        file.text = 'package example\nclass Generated\n'
    }
}

tasks.named('compileKotlin') {
    dependsOn('generateKotlinGraphFixture')
}
